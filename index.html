<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#378ADD">
<title>우찬이 다이어트 가자</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우찬이 운동">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: one phone-width column, sky-blue header band, two tabs with a fixed bottom bar. Single bright look by choice. */
:root{
  --sky:#378ADD; --sky-deep:#185FA5; --navy:#0C447C; --ink:#042C53;
  --mist:#E6F1FB; --line:#B5D4F4; --paper:#F3F8FD; --white:#FFFFFF;
  --sun:#FFCD3C; --sun-deep:#E0A200; --sun-pale:#FFF6D6;
  --muted:#6F8FB0; --danger:#C0392B;
  --font-display:"Jua","Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:480px;margin:0 auto}
h1,h2,h3,.disp{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.band{background:var(--sky);color:var(--white);padding-block:20px 22px}
.band .row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.band .kick{font-size:14px;color:var(--mist)}
.band .kick b{color:var(--sun);font-weight:400;font-family:var(--font-display)}
.band h1{font-size:28px;line-height:1.2;margin-top:2px}
.gear{background:rgba(255,255,255,.18);border:none;border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gear svg{width:22px;height:22px}

main{padding-block:16px 110px}
.stack{display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat .lab{font-size:13px;color:var(--sky-deep);display:flex;align-items:center;gap:5px}
.stat .lab i{width:9px;height:9px;border-radius:50%;background:var(--sun);display:inline-block}
.stat .val{font-family:var(--font-display);font-size:28px;color:var(--navy);line-height:1.2}
.streak{display:flex;align-items:center;gap:10px;background:var(--line);border-radius:14px;padding:10px 14px;color:var(--navy);font-size:14px}
.streak svg{width:22px;height:22px;flex-shrink:0}

.board{background:var(--mist);border-radius:20px;padding:14px 10px 12px}
.board-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.board-head h2{font-size:20px;color:var(--sky-deep)}
.nav{background:var(--white);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--sky-deep)}
.nav[aria-hidden="true"]{visibility:hidden}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{text-align:center;font-size:12px;color:var(--sky-deep);padding-bottom:2px}
.cal .h.sun{color:#D2563C}
.cal .d{aspect-ratio:1;border-radius:12px;position:relative;background:var(--white);border:1px solid var(--line);color:var(--sky-deep);font-size:12px;padding:0}
.cal .d .n{position:absolute;top:3px;left:5px;z-index:1;font-weight:700;text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 4px #fff;font-variant-numeric:tabular-nums}
.cal .d.e{background:transparent;border:none}
.cal .d.future{opacity:.55}
.cal .d.today{border:2px dashed var(--sun-deep);background:var(--sun-pale);color:var(--ink)}
.cal .d .stamp{position:absolute;left:52%;top:56%;width:92%;height:92%;transform:translate(-50%,-50%) rotate(-8deg);pointer-events:none}
.cal .d .stamp img,.cal .d .stamp svg{width:100%;height:100%;object-fit:contain;display:block}
.cal button.d{cursor:pointer}
.cal button.d:active{transform:scale(.95)}
.hint{font-size:12px;color:var(--muted);text-align:center;padding-top:10px}

.cta{width:100%;min-height:54px;border:none;border-radius:16px;background:var(--sun);color:var(--ink);font-family:var(--font-display);font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 0 var(--sun-deep)}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun-deep)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.cta{cursor:pointer;user-select:none}
.cta.done{background:var(--white);color:var(--sky-deep);box-shadow:none;border:2px solid var(--line)}
.cta svg{width:22px;height:22px}

.treasure{background:var(--sky);color:var(--white);border-radius:20px;padding:18px}
.treasure .kick{font-size:14px;color:var(--mist)}
.treasure .big{font-family:var(--font-display);font-size:38px;color:var(--sun);line-height:1.15}
.treasure .sub{font-size:14px;color:var(--mist);margin-top:2px}
.bar{margin-top:12px;height:10px;border-radius:6px;background:var(--sky-deep);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:6px}
.treasure .next{font-size:12px;color:var(--mist);margin-top:6px}

.sec{font-family:var(--font-display);font-size:18px;color:var(--navy);margin-top:6px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--white);border:1px solid var(--line)}
.mrow .ico{width:36px;height:36px;flex-shrink:0}
.mrow .ico img,.mrow .ico svg{width:100%;height:100%;object-fit:contain;display:block}
.mrow .t{flex:1;min-width:0}
.mrow .t b{font-family:var(--font-display);font-weight:400;font-size:17px;color:var(--navy);display:block}
.mrow .t span{font-size:13px;color:var(--sky-deep)}
.pill{font-size:12px;padding:4px 10px;border-radius:12px;white-space:nowrap}
.pill.left{background:var(--sun);color:var(--ink)}
.pill.got{background:var(--sky-deep);color:var(--white)}
.pill.rest{background:var(--mist);color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bdg{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.bdg svg{width:26px;height:26px;flex-shrink:0}
.bdg span{font-size:13px;color:var(--navy)}
.bdg.locked{background:var(--mist);border-color:transparent}
.bdg.locked span{color:var(--muted)}

.owner{background:var(--sun-pale);border:1px dashed var(--sun-deep);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px}
.owner .t{flex:1;min-width:0;font-size:13px;color:var(--ink)}
.owner .t b{font-family:var(--font-display);font-weight:400;font-size:20px;display:block}
.btn{border:none;border-radius:12px;padding:10px 14px;background:var(--sky-deep);color:var(--white);font-size:14px;min-height:42px}
.btn.ghost{background:var(--white);color:var(--sky-deep);border:1px solid var(--line)}
.btn.warn{background:var(--danger)}
.btn.sun{background:var(--sun);color:var(--ink)}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--sky-deep);font-size:14px}
.note{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--sky-deep)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--white);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .col{display:grid;grid-template-columns:1fr 1fr}
.tabs button{background:none;border:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--sky-deep);font-family:var(--font-display);font-size:14px}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(4,44,83,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--white);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
.sheet h3{font-size:22px;color:var(--navy);margin-bottom:12px}
.sheet .photo{width:100%;border-radius:16px;background:var(--mist);aspect-ratio:4/3;object-fit:cover;display:block}
.sheet .ph-wait{width:100%;aspect-ratio:4/3;border-radius:16px;background:var(--mist);display:flex;align-items:center;justify-content:center;color:var(--sky-deep);font-size:14px}
.sheet label{font-size:14px;color:var(--sky-deep);display:block;margin:12px 0 6px}
.sheet textarea,.sheet input[type=number]{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--paper)}
.sheet textarea{min-height:64px;resize:vertical}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts > *{flex:1}
.sheet .meta{font-size:13px;color:var(--muted);margin-top:8px}
.sheet .memo{font-size:16px;color:var(--ink);margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.sheet .err{font-size:13px;color:var(--danger);margin-top:8px}
.stamp-prev{width:96px;height:96px;margin:0 auto 8px}
.stamp-prev img,.stamp-prev svg{width:100%;height:100%;object-fit:contain}

.boom{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(243,248,253,.92);gap:10px}
.boom .s{width:180px;height:180px;animation:thud .55s cubic-bezier(.2,1.6,.4,1) both}
.boom .s img,.boom .s svg{width:100%;height:100%;object-fit:contain}
.boom .w{font-family:var(--font-display);font-size:40px;color:var(--sky-deep);animation:pop .4s .35s both}
.boom .m{font-family:var(--font-display);font-size:26px;color:var(--ink);background:var(--sun);padding:4px 16px;border-radius:14px;animation:pop .4s .5s both}
@keyframes thud{from{transform:scale(2.6) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.boom .s,.boom .w,.boom .m{animation:none}}

.post{background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.post .photo,.post .ph-wait{width:100%;aspect-ratio:4/3;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--mist);color:var(--sky-deep);font-size:14px}
.post .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.post .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.post .day{font-family:var(--font-display);font-size:18px;color:var(--navy)}
.tchip{font-size:12px;background:var(--mist);color:var(--sky-deep);padding:4px 10px;border-radius:10px;white-space:nowrap}
.post .memo{font-size:15px;color:var(--ink);overflow-wrap:anywhere;margin:0}
.cmt{background:var(--sun-pale);border-radius:14px;padding:10px 12px;font-size:15px;color:var(--ink);overflow-wrap:anywhere;white-space:pre-wrap}
.cmt b{display:block;font-family:var(--font-display);font-weight:400;font-size:13px;color:#8A5E00;margin-bottom:2px}
.cform{display:flex;gap:8px}
.cform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--paper)}
.trow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sheet input[type=time]{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--paper)}
.tinfo{font-size:14px;margin-top:8px;color:var(--sky-deep)}
.tinfo.bad{color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--white);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}

.band{padding-top:calc(20px + env(safe-area-inset-top,0px))}
.cal .d.add{cursor:pointer}
.cal .d.add::after{content:"+";position:absolute;right:5px;bottom:2px;font-size:14px;color:var(--line)}
.pinrow{display:flex;gap:8px;margin-top:8px}
.pinrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:20px;letter-spacing:.4em;text-align:center;color:var(--ink);background:var(--paper)}
.ownertag{display:inline-block;font-size:12px;background:var(--sun);color:var(--ink);padding:2px 8px;border-radius:8px;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="star-stamp" viewBox="0 0 40 40">
<circle cx="20" cy="20" r="17" fill="#378ADD"/>

<path d="M20 9.5 l3.1 6.6 7.2 .9 -5.3 5 1.4 7.1 -6.4 -3.6 -6.4 3.6 1.4 -7.1 -5.3 -5 7.2 -.9z" fill="#FFCD3C"/>
</symbol>
<symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-6 1-8.5z" fill="#FFCD3C" stroke="#E0A200" stroke-width="1.2" stroke-linejoin="round"/></symbol>

<symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 9.5l1.5 5 2-4 2 4 1.5-5M8 12h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<symbol id="b-fire" viewBox="0 0 24 24"><use href="#i-flame"/></symbol>

<symbol id="b-lock" viewBox="0 0 24 24"><rect x="5.5" y="10.5" width="13" height="10" rx="2.5" fill="none" stroke="#9CB6D0" stroke-width="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="#9CB6D0" stroke-width="2"/></symbol>
</defs></svg>

<header class="band">
  <div class="col gut row">
    <div>
      <p class="kick">하루 한 번, 도장 하나에 <b>500원</b><span class="ownertag" id="ownerTag" hidden>보호자 모드</span></p>
      <h1>우찬이 다이어트 가자!</h1>
    </div>
    <button class="gear" id="gearBtn" type="button" aria-label="설정"><svg><use href="#i-gear"/></svg></button>
  </div>
</header>

<main class="col gut">
  <section id="tab-cal" class="stack" aria-label="운동 인증">
    <div class="note" id="statusNote" hidden></div>
    <div class="stats">
      <div class="stat"><p class="lab"><i></i>적립금</p><p class="val num" id="sBalance">0원</p></div>
      <div class="stat"><p class="lab"><i></i><span id="sMonthLab">이번 달 운동</span></p><p class="val num" id="sMonth">0번</p></div>
    </div>
    <div class="streak"><svg><use href="#i-flame"/></svg><span id="streakTxt">오늘 첫 도장을 찍어볼까?</span></div>
    <div class="board">
      <div class="board-head">
        <button class="nav" id="prevM" type="button" aria-label="이전 달"><svg width="18" height="18"><use href="#i-left"/></svg></button>
        <h2 id="calTitle">운동 인증</h2>
        <button class="nav" id="nextM" type="button" aria-label="다음 달"><svg width="18" height="18"><use href="#i-right"/></svg></button>
      </div>
      <div class="cal" id="cal"></div>
      <p class="hint">도장을 누르면 그날 인증샷을 볼 수 있어요</p>
    </div>
    <label class="cta" id="ctaBtn" for="photoInput" role="button" tabindex="0"><svg><use href="#i-cam"/></svg><span id="ctaTxt">인증샷 올리고 도장 받기</span></label>
    <input type="file" id="photoInput" accept="image/*" class="vh">
    <h2 class="sec">최근 인증샷</h2>
    <div class="stack" id="feed"></div>
  </section>

  <section id="tab-money" class="stack" aria-label="모은 용돈" hidden>
    <div class="treasure">
      <p class="kick">지금까지 모은 용돈</p>
      <p class="big num" id="tTotal">0원</p>
      <p class="sub num" id="tSub">운동 0번 · 레벨 1</p>
      <div class="bar"><i id="tBar" style="width:0%"></i></div>
      <p class="next" id="tNext">레벨 2까지 운동 10번 남았어</p>
    </div>
    <div class="owner" id="ownerPay" hidden>
      <div class="t">우찬이에게 줄 용돈<b class="num" id="oBalance">0원</b></div>

<script>
/* ===== Supabase 연결 정보 (소선요가 앱과 같은 곳) ===== */
const SUPABASE_URL = 'https://vcemcdzilelnoebupxyp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjZW1jZHppbGVsbm9lYnVweHlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMzE1MjAsImV4cCI6MjA5MjYwNzUyMH0._OQ1vEDNgNhyNgV70Ph6Pi6Bwn9fA3HcbZ9bVC6gsv8';
/* ======================================================= */

(function(){
  const PER = 500;
  const $ = id => document.getElementById(id);
  const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
  const pad = n => String(n).padStart(2,'0');
  const ymd = (y,m,d) => y + '-' + pad(m) + '-' + pad(d);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const IMG_OK = /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/;
  const PIN_KEY = 'woochan_pin';

  /* ---------- Supabase ---------- */
  const H = {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json'};
  async function sbGet(path){
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {headers: H, cache: 'no-store'});
    if (!r.ok) throw new Error('load ' + r.status);
    return r.json();
  }
  async function rpc(fn, args){
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {method: 'POST', headers: H, body: JSON.stringify(args)});
    const txt = await r.text();
    let body = null; try { body = txt ? JSON.parse(txt) : null; } catch (e) {}
    if (!r.ok) { const e = new Error((body && body.message) || ('http ' + r.status)); e.code = (body && body.message) || ''; throw e; }
    return body;
  }

  function seoulNow(){
    const p = new Intl.DateTimeFormat('en-CA', {timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false}).formatToParts(new Date());
    const g = t => p.find(x => x.type === t).value;
    return {key: g('year') + '-' + g('month') + '-' + g('day'), y: +g('year'), m: +g('month'), hm: (g('hour') === '24' ? '00' : g('hour')) + ':' + g('minute')};
  }
  function todayKey(){ return seoulNow().key; }
  function addDays(key, n){ const [y,m,d] = key.split('-').map(Number); const t = new Date(Date.UTC(y, m-1, d+n)); return ymd(t.getUTCFullYear(), t.getUTCMonth()+1, t.getUTCDate()); }
  function fmtT(t){ if (!/^\d{2}:\d{2}$/.test(t||'')) return ''; const [h,m] = t.split(':').map(Number); return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + pad(m); }
  function timeLabel(c){ return (c.start && c.end) ? fmtT(c.start) + ' ~ ' + fmtT(c.end) + ' · ' + c.mins + '분' : ''; }
  function toMin(t){ const [h,m] = t.split(':').map(Number); return h*60 + m; }

  let pin = ''; try { pin = localStorage.getItem(PIN_KEY) || ''; } catch (e) {}
  let isOwner = false;
  let loaded = false;
  let checkins = {}, payouts = [], comments = {}, stamps = [null, null, null];
  const photoCache = {}, photoPending = {}, drafts = {};
  const sn = seoulNow();
  let viewY = sn.y, viewM = sn.m - 1;

  const DEF_STAMP = '<svg viewBox="0 0 40 40"><use href="#star-stamp"/></svg>';
  function stampSrc(i){
    const have = stamps.filter(Boolean);
    if (!have.length) return null;
    return have[i % have.length];
  }
  function stampHTML(i){ const u = stampSrc(i || 0); return u ? '<img src="' + u + '" alt="">' : DEF_STAMP; }
  function slotHTML(n){ return stamps[n] ? '<img src="' + stamps[n] + '" alt="">' : DEF_STAMP; }
  let dayIdx = {};
  function toast(msg){
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role','status');
    document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
  }
  function setNote(msg){ const n = $('statusNote'); n.hidden = !msg; n.textContent = msg || ''; }

  /* ---------- load ---------- */
  let loading = null;
  async function loadAll(){
    if (loading) return loading;
    loading = (async () => {
      try {
        const [ck, cm, po, st] = await Promise.all([
          sbGet('wc_checkins?select=d,note,t_start,t_end,mins,created_at&order=d.asc'),
          sbGet('wc_comments?select=d,body'),
          sbGet('wc_payouts?select=amount'),
          sbGet('wc_settings?select=k,v&k=in.(stamp,stamp2,stamp3)')
        ]);
        const next = {};
        ck.forEach(r => { next[r.d] = {note: r.note || '', start: r.t_start || '', end: r.t_end || '', mins: r.mins || 0, at: r.created_at ? Date.parse(r.created_at) : 0}; });
        checkins = next;
        comments = {}; cm.forEach(r => { comments[r.d] = {text: String(r.body || '').slice(0, 100)}; });
        payouts = po.map(r => ({amount: Number(r.amount) || 0}));
        const ok = v => (typeof v === 'string' && IMG_OK.test(v)) ? v : null;
        const f = k => { const r = st.find(x => x.k === k); return r ? ok(r.v) : null; };
        stamps = [f('stamp'), f('stamp2'), f('stamp3')];
        loaded = true; setNote('');
      } catch (e) {
        setNote(loaded ? '' : '기록을 불러오지 못했어요. 인터넷 연결을 확인하고 화면을 다시 열어 주세요.');
      }
      loading = null; render();
    })();
    return loading;
  }

  /* ---------- derived numbers ---------- */
  function compute(){
    const dates = Object.keys(checkins).sort();
    dayIdx = {}; dates.forEach((k, i) => { dayIdx[k] = i; });
    const earned = dates.length * PER;
    const paid = payouts.reduce((s,p) => s + p.amount, 0);
    let pool = paid;
    const months = {};
    dates.forEach(k => {
      const mk = k.slice(0,7);
      const m = months[mk] || (months[mk] = {count:0, earned:0, got:0});
      m.count++; m.earned += PER;
      const g = Math.min(PER, Math.max(0, pool)); m.got += g; pool -= g;
    });
    const today = todayKey();
    let streak = 0, cur = checkins[today] ? today : addDays(today, -1);
    while (checkins[cur]) { streak++; cur = addDays(cur, -1); }
    let best = 0, run = 0, prev = null;
    dates.forEach(k => { run = (prev && addDays(prev,1) === k) ? run + 1 : 1; best = Math.max(best, run); prev = k; });
    const bestMonth = Object.values(months).reduce((b,m) => Math.max(b, m.count), 0);
    return {dates, earned, paid, balance: Math.max(0, earned - paid), months, streak, best, bestMonth, today};
  }

  /* ---------- render ---------- */
  function render(){
    const c = compute();
    const s = seoulNow();
    $('ownerTag').hidden = !isOwner;
    $('sBalance').textContent = won(c.balance);
    $('sMonthLab').textContent = s.m + '월 운동';
    $('sMonth').textContent = (c.months[c.today.slice(0,7)] || {count:0}).count + '번';
    const doneToday = !!checkins[c.today];
    $('streakTxt').textContent = c.streak === 0 ? '오늘 첫 도장을 찍어볼까?'
      : doneToday ? c.streak + '일 연속 성공! 내일도 이어가자'
      : c.streak + '일 연속 성공! 오늘 하면 ' + (c.streak + 1) + '일째';
    $('ctaBtn').classList.toggle('done', doneToday);
    $('ctaTxt').textContent = doneToday ? '오늘 도장 완료! 내일 또 만나' : '인증샷 올리고 도장 받기';
    renderCal(c); renderFeed(c); renderMoney(c);
  }

  function renderCal(c){
    const s = seoulNow();
    $('calTitle').textContent = (viewY === s.y ? '' : viewY + '년 ') + (viewM+1) + '월 운동 인증';
    const atCur = viewY === s.y && viewM === s.m - 1;
    $('nextM').setAttribute('aria-hidden', atCur ? 'true' : 'false');
    $('nextM').tabIndex = atCur ? -1 : 0;
    const dows = ['일','월','화','수','목','금','토'];
    let h = dows.map((d,i) => '<div class="h' + (i===0 ? ' sun' : '') + '">' + d + '</div>').join('');
    const start = new Date(viewY, viewM, 1).getDay();
    const days = new Date(viewY, viewM+1, 0).getDate();
    for (let i = 0; i < start; i++) h += '<div class="d e"></div>';
    for (let d = 1; d <= days; d++){
      const k = ymd(viewY, viewM+1, d);
      const cls = 'd' + (k === c.today ? ' today' : '') + (k > c.today ? ' future' : '');
      if (checkins[k]) h += '<button type="button" class="' + cls + '" data-day="' + k + '" aria-label="' + (viewM+1) + '월 ' + d + '일 인증샷 보기"><span class="n">' + d + '</span><span class="stamp">' + stampHTML(dayIdx[k]) + '</span></button>';
      else if (isOwner && k < c.today) h += '<label for="photoInput" role="button" tabindex="0" class="' + cls + ' add" data-past="' + k + '" aria-label="' + (viewM+1) + '월 ' + d + '일 인증 올리기"><span class="n">' + d + '</span></label>';
      else h += '<div class="' + cls + '"><span class="n">' + d + '</span></div>';
    }
    $('cal').innerHTML = h;
  }

  function cmtHTML(k){
    const cm = comments[k];
    return cm && cm.text ? '<div class="cmt"><b>응원 한마디</b>' + esc(cm.text) + '</div>' : '';
  }
  function renderFeed(c){
    const keys = c.dates.slice(-3).reverse();
    if (!keys.length) { $('feed').innerHTML = '<div class="empty">' + (loaded ? '인증샷을 올리면 여기에 사진과 응원 한마디가 보여요' : '기록을 불러오는 중이에요') + '</div>'; return; }
    const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.cin : null;
    $('feed').innerHTML = keys.map(k => {
      const ck = checkins[k]; const [, m, d] = k.split('-').map(Number);
      const tl = timeLabel(ck); const has = comments[k] && comments[k].text;
      return '<article class="post"><div data-ph="' + k + '"><div class="ph-wait">사진 불러오는 중</div></div><div class="body">' +
        '<div class="top"><span class="day">' + m + '월 ' + d + '일</span>' + (tl ? '<span class="tchip">' + esc(tl) + '</span>' : '') + '</div>' +
        (ck.note ? '<p class="memo">' + esc(ck.note) + '</p>' : '') + cmtHTML(k) +
        (isOwner ? '<div class="cform"><input type="text" maxlength="100" aria-label="응원 한마디" data-cin="' + k + '" placeholder="우찬아 오늘도 최고야!" value="' + esc(drafts[k] || '') + '"><button type="button" class="btn" data-csend="' + k + '">' + (has ? '고치기' : '남기기') + '</button></div>' : '') +
        '</div></article>';
    }).join('');
    $('feed').querySelectorAll('[data-ph]').forEach(el => fillPhoto(el, el.dataset.ph));
    if (active) { const i = $('feed').querySelector('[data-cin="' + active + '"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  }
  function getPhoto(k){
    if (k in photoCache) return Promise.resolve(photoCache[k]);
    if (!photoPending[k]) photoPending[k] = sbGet('wc_photos?select=img&d=eq.' + k).then(rows => {
      const v = rows[0] && rows[0].img;
      const ok = (typeof v === 'string' && IMG_OK.test(v)) ? v : null;
      if (ok) photoCache[k] = ok; delete photoPending[k]; return ok;
    }).catch(() => { delete photoPending[k]; return null; });
    return photoPending[k];
  }
  function fillPhoto(el, k){
    getPhoto(k).then(src => {
      if (!el.isConnected) return;
      const [, m, d] = k.split('-').map(Number);
      if (!src) { el.innerHTML = '<div class="ph-wait">사진을 찾을 수 없어요</div>'; return; }
      const img = document.createElement('img'); img.className = 'photo'; img.alt = m + '월 ' + d + '일 인증샷'; img.src = src;
      el.innerHTML = ''; el.appendChild(img);
    });
  }

  function renderMoney(c){
    const n = c.dates.length;
    const level = Math.floor(n / 10) + 1;
    $('tTotal').textContent = won(c.earned);
    $('tSub').textContent = '운동 ' + n + '번 · 레벨 ' + level;
    $('tBar').style.width = ((n % 10) * 10) + '%';
    $('tNext').textContent = '레벨 ' + (level+1) + '까지 운동 ' + (level*10 - n) + '번 남았어';
    $('ownerPay').hidden = !(isOwner && c.balance > 0);
    $('oBalance').textContent = won(c.balance);
    const keys = Object.keys(c.months).sort().reverse();
    const s = seoulNow();
    $('months').innerHTML = !keys.length ? '<div class="empty">첫 인증샷을 올리면 여기에 달마다 모은 용돈이 쌓여요</div>' : keys.map(k => {
      const m = c.months[k]; const left = m.earned - m.got;
      const [y, mm] = k.split('-').map(Number);
      const label = (y === s.y ? '' : y + '년 ') + mm + '월 · ' + m.count + '번';
      const pill = left > 0 ? '<span class="pill left">' + won(left) + ' 남음</span>' : '<span class="pill got">다 받았어</span>';
      return '<div class="mrow"><span class="ico">' + stampHTML(dayIdx[c.dates.find(x => x.startsWith(k))] || 0) + '</span><div class="t"><b>' + label + '</b><span class="num">' + won(m.earned) + '</span></div>' + pill + '</div>';
    }).join('');
    const badges = [
      ['b-medal','첫 도장', n >= 1], ['b-fire','3일 연속', c.best >= 3], ['b-fire','7일 연속', c.best >= 7],
      ['b-trophy','한 달 15번', c.bestMonth >= 15], ['b-rocket','운동 50번', n >= 50], ['b-crown','운동 100번', n >= 100]
    ];
    $('badges').innerHTML = badges.map(([ic, name, ok]) =>
      '<div class="bdg' + (ok ? '' : ' locked') + '"><svg><use href="#' + (ok ? ic : 'b-lock') + '"/></svg><span>' + name + '</span></div>').join('');
  }

  /* ---------- tabs and month nav ---------- */
  function showTab(which){
    const cal = which === 'cal';
    $('tab-cal').hidden = !cal; $('tab-money').hidden = cal;
    $('tbCal').setAttribute('aria-selected', String(cal));
    $('tbMoney').setAttribute('aria-selected', String(!cal));
    window.scrollTo(0,0);
  }
  $('tbCal').onclick = () => showTab('cal');
  $('tbMoney').onclick = () => showTab('money');
  $('prevM').onclick = () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } render(); };
  $('nextM').onclick = () => {
    const s = seoulNow(); if (viewY === s.y && viewM === s.m - 1) return;
    viewM++; if (viewM > 11) { viewM = 0; viewY++; } render();
  };

  /* ---------- sheets ---------- */
  function openSheet(html, onMount){
    $('layer').innerHTML = '<div class="scrim" id="scrim"><div class="sheet gut" role="dialog" aria-modal="true">' + html + '</div></div>';
    const scrim = $('scrim');
    scrim.addEventListener('click', e => { if (e.target === scrim) closeSheet(); });
    if (onMount) onMount();
  }
  function closeSheet(){ $('layer').innerHTML = ''; }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  /* ---------- image shrink ---------- */
  function loadImg(file){
    return new Promise((res, rej) => {
      const u = URL.createObjectURL(file); const i = new Image();
      i.onload = () => { URL.revokeObjectURL(u); res(i); };
      i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); };
      i.src = u;
    });
  }
  async function shrink(file, max, type, limit){
    const img = await loadImg(file);
    const s = Math.min(1, max / Math.max(img.width, img.height));
    let w = Math.round(img.width * s), h = Math.round(img.height * s);
    const cv = document.createElement('canvas');
    let q = 0.78, out = '';
    for (let tries = 0; tries < 10; tries++){
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); }
      ctx.drawImage(img, 0, 0, w, h);
      out = cv.toDataURL(type, q);
      if (out.length <= limit) return out;
      if (type === 'image/jpeg' && q > 0.5) q -= 0.08; else { w = Math.round(w*0.8); h = Math.round(h*0.8); }
    }
    return out.length <= limit ? out : null;
  }

  /* ---------- upload ---------- */
  $('ctaBtn').addEventListener('click', e => {
    const t = todayKey();
    if (checkins[t]) { e.preventDefault(); openDay(t); return; }
    if (!loaded) { e.preventDefault(); toast('기록을 불러오는 중이에요. 잠시 뒤에 다시 눌러 주세요'); loadAll(); return; }
    pendingDate = null;
    $('photoInput').value = '';
  });
  $('ctaBtn').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('ctaBtn').click(); } });
  let pendingDate = null;
  $('photoInput').onchange = async e => {
    const forDay = (pendingDate && pendingDate < todayKey()) ? pendingDate : null;
    pendingDate = null;
    const f = e.target.files && e.target.files[0]; if (!f) return;
    let data = null;
    try { data = await shrink(f, 900, 'image/jpeg', 190000); } catch (err) {}
    if (!data) { toast('사진을 열 수 없어요. 다른 사진으로 해볼까?'); return; }
    const nowHm = seoulNow().hm;
    const sm = (toMin(nowHm) - 30 + 1440) % 1440;
    const defEnd = nowHm, defStart = pad(Math.floor(sm / 60)) + ':' + pad(sm % 60);
    openSheet(
      '<h3>' + (forDay ? Number(forDay.slice(5,7)) + '월 ' + Number(forDay.slice(8)) + '일 운동 인증' : '오늘 운동 인증') + '</h3><img class="photo" alt="고른 인증샷" src="' + data + '">' +
      '<div class="trow"><div><label for="tStart">시작한 시간</label><input type="time" id="tStart" value="' + defStart + '"></div><div><label for="tEnd">끝난 시간</label><input type="time" id="tEnd" value="' + defEnd + '"></div></div>' +
      '<p class="tinfo" id="tInfo"></p>' +
      '<label for="memo">무슨 운동 했어?</label><textarea id="memo" maxlength="80" placeholder="줄넘기 300개 했어요"></textarea>' +
      '<p class="err" id="upErr" hidden></p>' +
      '<div class="acts"><button type="button" class="btn ghost" id="upCancel">다음에</button><button type="button" class="btn sun" id="upGo">도장 쾅!</button></div>',
      () => {
        $('upCancel').onclick = closeSheet;
        const mins = () => { const a = $('tStart').value, b = $('tEnd').value; return (a && b) ? toMin(b) - toMin(a) : NaN; };
        const info = () => {
          const n = mins(), el = $('tInfo'); $('upErr').hidden = true;
          if (isNaN(n)) { el.className = 'tinfo bad'; el.textContent = '시작한 시간과 끝난 시간을 적어 줘'; return false; }
          if (n <= 0) { el.className = 'tinfo bad'; el.textContent = '끝난 시간이 시작한 시간보다 늦어야 해'; return false; }
          if (n < 30) { el.className = 'tinfo bad'; el.textContent = n + '분 했어. 30분 이상 해야 도장을 받을 수 있어!'; return false; }
          el.className = 'tinfo'; el.textContent = n + '분 운동했어! 도장 받을 수 있어'; return true;
        };
        $('tStart').oninput = info; $('tEnd').oninput = info; info();
        $('upGo').onclick = async () => {
          if (!info()) { $('tInfo').scrollIntoView({block: 'center'}); return; }
          const btn = $('upGo'); btn.disabled = true; btn.textContent = '올리는 중…';
          try {
            const args = {p_note: $('memo').value.trim().slice(0, 80), p_start: $('tStart').value, p_end: $('tEnd').value, p_img: data};
            const res = forDay ? await ownerCall('wc_submit_past', Object.assign({p_d: forDay}, args)) : await rpc('wc_submit', args);
            if (res && res.d) photoCache[res.d] = data;
            closeSheet(); celebrate(); loadAll();
          } catch (err) {
            btn.disabled = false; btn.textContent = '도장 쾅!';
            const m = $('upErr'); m.hidden = false;
            m.textContent = err.code === 'already_done' ? (forDay ? '그날은 이미 도장이 있어요.' : '오늘은 이미 도장을 받았어! 내일 또 올려 줘.')
              : err.code === 'bad_date' ? '오늘이나 미래 날짜는 여기서 올릴 수 없어요.'
              : /wc_submit_past|function|schema/i.test(err.message || '') && forDay ? 'Supabase에 지난 날짜 설정이 아직 없어요. 추가 SQL을 실행해 주세요.'
              : err.code === 'too_short' ? '30분 이상 해야 도장을 받을 수 있어!'
              : err.code === 'bad_image' ? '이 사진은 올릴 수 없어요. 다른 사진으로 해 볼까?'
              : '올리지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
            if (err.code === 'already_done') loadAll();
          }
        };
      });
  };

  function celebrate(){
    const b = document.createElement('div'); b.className = 'boom'; b.setAttribute('role','status');
    b.innerHTML = '<div class="s">' + stampHTML(Object.keys(checkins).filter(k => k < todayKey()).length) + '</div><p class="w">쾅!</p><p class="m">+500원</p>';
    document.body.appendChild(b);
    const done = () => b.remove();
    b.onclick = done; setTimeout(done, 1900);
  }

  /* ---------- owner helpers ---------- */
  async function ownerCall(fn, args){
    try { return await rpc(fn, Object.assign({p_pin: pin}, args)); }
    catch (e) {
      if (e.code === 'wrong_pin') { isOwner = false; pin = ''; try { localStorage.removeItem(PIN_KEY); } catch (x) {} render(); toast('비밀번호가 바뀌었어요. 설정에서 다시 입력해 주세요'); }
      throw e;
    }
  }
  async function saveComment(k, text){
    await ownerCall('wc_comment', {p_d: k, p_body: text});
    comments[k] = {text: text.slice(0, 100)};
  }

  /* ---------- feed comments ---------- */
  $('feed').addEventListener('input', e => { const i = e.target.closest('[data-cin]'); if (i) drafts[i.dataset.cin] = i.value; });
  $('feed').addEventListener('click', async e => {
    const b = e.target.closest('[data-csend]'); if (!b) return;
    const k = b.dataset.csend; const inp = $('feed').querySelector('[data-cin="' + k + '"]');
    const text = (inp ? inp.value : '').trim();
    if (!text) { toast('응원 한마디를 적어 주세요'); return; }
    b.disabled = true;
    try { await saveComment(k, text); drafts[k] = ''; render(); toast('응원 한마디를 남겼어요'); }
    catch (err) { b.disabled = false; if (err.code !== 'wrong_pin') toast('남기지 못했어요. 다시 눌러 주세요'); }
  });

  /* ---------- day viewer ---------- */
  function openDay(key){
    const c = checkins[key]; if (!c) return;
    const [, m, d] = key.split('-').map(Number);
    const t = c.at ? new Date(c.at) : null;
    const time = t ? new Intl.DateTimeFormat('ko-KR', {timeZone: 'Asia/Seoul', hour: 'numeric', minute: '2-digit'}).format(t) : '';
    openSheet(
      '<h3>' + m + '월 ' + d + '일 인증샷</h3><div id="phBox" class="ph-wait">사진 불러오는 중</div>' +
      (timeLabel(c) ? '<p class="meta">' + esc(timeLabel(c)) + '</p>' : '') +
      (c.note ? '<p class="memo">' + esc(c.note) + '</p>' : '') +
      '<div id="dayCmt" style="margin-top:10px">' + cmtHTML(key) + '</div>' +
      (isOwner ? '<div class="cform" style="margin-top:8px"><input type="text" id="dayCin" maxlength="100" aria-label="응원 한마디" placeholder="우찬아 오늘도 최고야!"><button type="button" class="btn" id="dayCsend">' + (comments[key] ? '고치기' : '남기기') + '</button></div>' : '') +
      '<p class="meta">' + (time ? time + '에 올림 · ' : '') + '+500원</p>' +
      (isOwner ? '<div class="acts"><button type="button" class="btn ghost" id="editAsk">시간·메모·사진 고치기</button><button type="button" class="btn ghost" id="delAsk">인증 지우기</button></div>' : '') +
      '<div id="editBox" hidden>' +
        '<div class="trow"><div><label for="eStart">시작한 시간</label><input type="time" id="eStart" value="' + esc(c.start) + '"></div><div><label for="eEnd">끝난 시간</label><input type="time" id="eEnd" value="' + esc(c.end) + '"></div></div>' +
        '<p class="tinfo" id="eInfo"></p>' +
        '<label for="eMemo">무슨 운동 했어?</label><textarea id="eMemo" maxlength="80">' + esc(c.note) + '</textarea>' +
        '<label class="btn ghost" for="ePhoto" style="display:flex;align-items:center;justify-content:center;cursor:pointer;margin:10px 0 0;color:var(--sky-deep)" id="ePhotoLab">사진 바꾸기</label><input type="file" id="ePhoto" accept="image/*" class="vh">' +
        '<p class="err" id="eErr" hidden></p>' +
        '<div class="acts"><button type="button" class="btn ghost" id="eNo">취소</button><button type="button" class="btn" id="eYes">저장</button></div>' +
      '</div>' +
      '<div class="acts"><button type="button" class="btn" id="dayClose">닫기</button></div>' +
      '<div id="delBox" hidden><p class="meta">지우면 사진, 응원 한마디, 500원 적립이 같이 사라져요.</p><div class="acts"><button type="button" class="btn ghost" id="delNo">그대로 두기</button><button type="button" class="btn warn" id="delYes">지우기</button></div></div>',
      () => {
        $('dayClose').onclick = closeSheet;
        getPhoto(key).then(img => {
          const box = $('phBox'); if (!box) return;
          if (img) { const el = document.createElement('img'); el.className = 'photo'; el.alt = m + '월 ' + d + '일 인증샷'; el.src = img; box.replaceWith(el); }
          else box.textContent = '사진을 찾을 수 없어요';
        });
        if (!isOwner) return;
        $('dayCsend').onclick = async () => {
          const text = $('dayCin').value.trim();
          if (!text) { toast('응원 한마디를 적어 주세요'); return; }
          try { await saveComment(key, text); $('dayCmt').innerHTML = cmtHTML(key); $('dayCin').value = ''; $('dayCsend').textContent = '고치기'; render(); toast('응원 한마디를 남겼어요'); }
          catch (e) { if (e.code !== 'wrong_pin') toast('남기지 못했어요. 다시 눌러 주세요'); }
        };
        let newImg = null;
        const eMins = () => { const a = $('eStart').value, b = $('eEnd').value; return (a && b) ? toMin(b) - toMin(a) : NaN; };
        const eInfo = () => {
          const n = eMins(), el = $('eInfo'); $('eErr').hidden = true;
          if (isNaN(n)) { el.className = 'tinfo bad'; el.textContent = '시작한 시간과 끝난 시간을 적어 주세요'; return false; }
          if (n < 30) { el.className = 'tinfo bad'; el.textContent = (n > 0 ? n + '분이에요. ' : '') + '30분 이상이어야 해요'; return false; }
          el.className = 'tinfo'; el.textContent = n + '분 운동'; return true;
        };
        $('editAsk').onclick = () => { $('editBox').hidden = false; $('delBox').hidden = true; eInfo(); $('editBox').scrollIntoView({block: 'nearest'}); };
        $('eStart').oninput = eInfo; $('eEnd').oninput = eInfo;
        $('eNo').onclick = () => { $('editBox').hidden = true; };
        $('ePhotoLab').onclick = () => { $('ePhoto').value = ''; };
        $('ePhoto').onchange = async ev => {
          const f = ev.target.files && ev.target.files[0]; if (!f) return;
          try { newImg = await shrink(f, 900, 'image/jpeg', 190000); } catch (x) { newImg = null; }
          if (!newImg) { toast('사진을 열 수 없어요. 다른 사진으로 해 주세요'); return; }
          const cur = $('layer').querySelector('.sheet img.photo, #phBox');
          if (cur) { const el = document.createElement('img'); el.className = 'photo'; el.alt = '새 인증샷'; el.src = newImg; cur.replaceWith(el); }
          $('ePhotoLab').textContent = '사진 골랐어요 (저장을 눌러 주세요)';
        };
        $('eYes').onclick = async () => {
          if (!eInfo()) return;
          const btn = $('eYes'); btn.disabled = true;
          try {
            await ownerCall('wc_edit_day', {p_d: key, p_note: $('eMemo').value.trim().slice(0, 80), p_start: $('eStart').value, p_end: $('eEnd').value, p_img: newImg});
            if (newImg) photoCache[key] = newImg;
            closeSheet(); toast('고쳤어요'); loadAll();
          } catch (e) {
            btn.disabled = false;
            if (e.code === 'wrong_pin') return;
            const m = $('eErr'); m.hidden = false;
            m.textContent = /wc_edit_day|function|schema/i.test(e.message || '') ? 'Supabase에 고치기 설정이 아직 없어요. 추가 SQL을 실행해 주세요.' : e.code === 'too_short' ? '30분 이상이어야 해요.' : '저장하지 못했어요. 다시 눌러 주세요.';
          }
        };
        $('delAsk').onclick = () => { $('delBox').hidden = false; $('editBox').hidden = true; };
        $('delNo').onclick = () => { $('delBox').hidden = true; };
        $('delYes').onclick = async () => {
          try { await ownerCall('wc_delete_day', {p_d: key}); delete photoCache[key]; closeSheet(); toast('도장을 지웠어요'); loadAll(); }
          catch (e) { if (e.code !== 'wrong_pin') toast('지우지 못했어요. 다시 해 주세요'); }
        };
      });
  }
  $('cal').addEventListener('click', e => {
    const b = e.target.closest('[data-day]'); if (b) { openDay(b.dataset.day); return; }
    const a = e.target.closest('[data-past]'); if (a) { pendingDate = a.dataset.past; $('photoInput').value = ''; }
  });

  /* ---------- owner: payout ---------- */
  $('payBtn').onclick = () => {
    const bal = compute().balance;
    openSheet(
      '<h3>용돈 준 거 체크하기</h3><p class="meta">우찬이에게 준 금액을 적어 주세요. 적립금에서 빠지고, 달마다 기록에 "다 받았어"로 표시돼요.</p>' +
      '<label for="payAmt">준 금액 (원)</label><input type="number" id="payAmt" inputmode="numeric" min="500" step="500" value="' + bal + '">' +
      '<p class="err" id="payErr" hidden></p>' +
      '<div class="acts"><button type="button" class="btn ghost" id="payNo">취소</button><button type="button" class="btn" id="payYes">저장</button></div>',
      () => {
        $('payNo').onclick = closeSheet;
        $('payAmt').oninput = () => { $('payErr').hidden = true; };
        $('payYes').onclick = async () => {
          const v = Math.round(Number($('payAmt').value));
          const err = $('payErr');
          if (!v || v <= 0) { err.hidden = false; err.textContent = '금액을 적어 주세요.'; return; }
          if (v > bal) { err.hidden = false; err.textContent = '적립금(' + won(bal) + ')보다 많아요.'; return; }
          try { await ownerCall('wc_pay', {p_amount: v}); closeSheet(); toast(won(v) + ' 준 걸로 기록했어요'); loadAll(); }
          catch (e) { if (e.code !== 'wrong_pin') { err.hidden = false; err.textContent = '저장하지 못했어요. 다시 눌러 주세요.'; } else closeSheet(); }
        };
      });
  };

  /* ---------- settings: PIN + stamp ---------- */
  $('gearBtn').onclick = () => {
    if (!isOwner) {
      openSheet(
        '<h3>보호자 모드</h3><p class="meta">응원 한마디, 용돈 체크, 도장 바꾸기는 보호자 비밀번호를 넣어야 쓸 수 있어요.</p>' +
        '<div class="pinrow"><input type="password" id="pinIn" inputmode="numeric" maxlength="12" autocomplete="off" aria-label="보호자 비밀번호"><button type="button" class="btn" id="pinGo">확인</button></div>' +
        '<p class="err" id="pinErr" hidden></p>' +
        '<div class="acts"><button type="button" class="btn ghost" id="pinClose">닫기</button></div>',
        () => {
          $('pinClose').onclick = closeSheet;
          $('pinIn').oninput = () => { $('pinErr').hidden = true; };
          const go = async () => {
            const v = $('pinIn').value.trim(); const err = $('pinErr');
            if (!v) { err.hidden = false; err.textContent = '비밀번호를 넣어 주세요.'; return; }
            try {
              const ok = await rpc('wc_pin_ok', {p_pin: v});
              if (!ok) { err.hidden = false; err.textContent = '비밀번호가 달라요. 다시 확인해 주세요.'; return; }
              pin = v; isOwner = true; try { localStorage.setItem(PIN_KEY, v); } catch (e) {}
              closeSheet(); render(); toast('보호자 모드가 켜졌어요');
            } catch (e) { err.hidden = false; err.textContent = '확인하지 못했어요. 인터넷 연결을 확인해 주세요.'; }
          };
          $('pinGo').onclick = go;
          $('pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
          setTimeout(() => $('pinIn').focus(), 50);
        });
      return;
    }
    openSheet(
      '<h3>도장 바꾸기</h3><p class="meta">깜빡한 날은 달력의 빈 지난 날짜(+ 표시)를 누르면 올릴 수 있어요.</p><p class="meta">넣은 도장들이 운동할 때마다 차례로 번갈아 찍혀요. 배경이 투명한 PNG가 제일 예뻐요.</p>' +
      '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px">' +
      [0,1,2].map(n => '<div class="stat" style="text-align:center;padding:10px 6px"><p class="lab" style="justify-content:center">도장 ' + (n+1) + '</p><div class="stamp-prev" style="width:60px;height:60px;margin:6px auto 8px">' + slotHTML(n) + '</div>' +
        '<label class="btn" for="stampInput" data-slot="' + n + '" style="display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--white);margin:0;padding:8px 4px;font-size:13px">고르기</label>' +
        (stamps[n] ? '<button type="button" class="btn ghost" data-clear="' + n + '" style="width:100%;margin-top:6px;padding:8px 4px;font-size:13px">비우기</button>' : '') + '</div>').join('') +
      '</div><p class="meta">모든 칸을 비우면 기본 별 도장이 찍혀요.</p>' +
      '<div class="acts"><button type="button" class="btn ghost" id="lockBtn">보호자 모드 끄기</button><button type="button" class="btn ghost" id="stClose">닫기</button></div>',
      () => {
        $('stClose').onclick = closeSheet;
        $('layer').querySelectorAll('[data-slot]').forEach(l => { l.onclick = () => { pickSlot = Number(l.dataset.slot); $('stampInput').value = ''; }; });
        $('layer').querySelectorAll('[data-clear]').forEach(b => { b.onclick = () => saveStamp(Number(b.dataset.clear), null); });
        $('lockBtn').onclick = () => { isOwner = false; pin = ''; try { localStorage.removeItem(PIN_KEY); } catch (e) {} closeSheet(); render(); toast('보호자 모드를 껐어요'); };
      });
  };
  let pickSlot = 0;
  async function saveStamp(n, data){
    try {
      await ownerCall(['wc_set_stamp', 'wc_set_stamp2', 'wc_set_stamp3'][n], {p_img: data});
      stamps[n] = data; closeSheet(); render(); toast(data ? '도장 ' + (n+1) + '을 바꿨어요' : '도장 ' + (n+1) + '을 비웠어요');
    } catch (e) {
      if (e.code === 'wrong_pin') return;
      toast(/wc_set_stamp|function|schema/i.test(e.message || '') ? 'Supabase에 도장 ' + (n+1) + ' 설정이 아직 없어요. 추가 SQL을 실행해 주세요' : '바꾸지 못했어요. 다시 해 주세요');
    }
  }
  $('stampInput').onchange = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    let data = null;
    try { data = await shrink(f, 220, 'image/png', 150000); } catch (err) {}
    if (!data) { toast('이 그림은 쓸 수 없어요. 다른 그림을 골라 주세요'); return; }
    saveStamp(pickSlot, data);
  };

  /* ---------- boot ---------- */
  render();
  loadAll();
  if (pin) rpc('wc_pin_ok', {p_pin: pin}).then(ok => {
    isOwner = !!ok;
    if (!ok) { pin = ''; try { localStorage.removeItem(PIN_KEY); } catch (e) {} }
    render();
  }).catch(() => {});
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadAll(); });
  setInterval(() => { if (document.visibilityState === 'visible' && !$('layer').innerHTML) loadAll(); }, 60000);
})();
</script>
</body>
</html>
